name: Build prerelease

# Rebuilds on every push to main and republishes all binaries as assets on the single rolling 
# "latest-main" release.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # allows manual triggering from UI, CLI, or API

permissions:
  contents: write

env:
  RELEASE_TAG: latest-main

jobs:
  ensure_release:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: create latest-main release if it doesn't exist yet
      shell: bash
      run: |
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          echo "Release '$RELEASE_TAG' already exists, reusing it."
        else
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Automated build of the latest main commit ($GITHUB_SHA). Assets are replaced on every push to main." \
            --target "$GITHUB_SHA" \
            --prerelease
        fi
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_operators:
    needs: ensure_release
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - run: sudo apt install lld
    - run: ./scripts/build_dandelion.sh
    - name: upload operators
      shell: bash
      run: gh release upload "$RELEASE_TAG" build_dandelion/functions/plume_* --clobber
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_client:
    needs: ensure_release
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - run: ./scripts/build_client.sh
    - name: upload client binaries
      shell: bash
      run: |
        gh release upload "$RELEASE_TAG" \
          build/plume/client/plume \
          build/plume/client/plume_export \
          build/plume/benchmarks/plume_bench \
          --clobber
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
