syntax = "proto3";

package dandelion_frontend;
option optimize_for = LITE_RUNTIME;

message DandelionRequest {
    oneof target {
        string name = 1;
        string composition = 2;
    }
    repeated InputSet sets = 3;
}

message DandelionResponse {
    repeated InputSet sets = 1;
    optional string trace = 2;
}

message InputSet {
    repeated InputItem items = 1;
}

message InputItem {
    string identifier = 1;
    uint32 key = 2;
    uint64 payload_length = 3;
}

message RegisterFunction {
    string name = 1;
    uint64 context_size = 2;
    string engine_type = 3;
    oneof executable {
        string local_path = 4;
        uint64 binary_length = 5;
    }
    repeated InputSet input_sets = 6;
    repeated string output_sets = 7;
    repeated uint64 min_set_bytes = 8;
}

message RegisterComposition {
    string composition = 1;
}

message StatusResponse {
    string message = 1;
}
